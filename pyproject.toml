[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-agent day-trading system for US equities (paper trading)."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
    "PyYAML>=6.0,<7",
    "exchange-calendars>=4.13,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_agent.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs against TEST_DATABASE_URL; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
