[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1"  # docs/policy/versioning.md
description = "Multi-agent day-trading system for US equities (paper trading)."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
    "PyYAML>=6.0,<7",
    "exchange-calendars>=4.13,<5",
    "alpaca-py>=0.44,<0.45",
    # Research on Claude (ADR 0018); imported only by research/anthropic_client.py.
    "anthropic>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "import-linter>=2",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_agent.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs against TEST_DATABASE_URL; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 50

# Module boundaries (ADRs 0002, 0003, 0005, 0004). Run: lint-imports
[tool.importlinter]
root_package = "trading_agent"

[[tool.importlinter.contracts]]
name = "layers: higher components import only from layers below; siblings stay independent"
type = "layers"
containers = ["trading_agent"]
layers = [
    "execution | orchestrator | research | portfolio_manager | opportunistic_identifier | journal",
    "reference",
    "risk",
    "llm | storage",
]
