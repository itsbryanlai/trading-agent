# Settings for the Opportunistic Identifier (python -m trading_agent.opportunistic_identifier).
#
# Schema: specs/011-opportunistic-identifier/contracts/oi-interface.md
# ("Configuration"). Every key is required and unknown keys are rejected; a bad
# file means the agent refuses to start. The loader also refuses a slice that
# can't be fetched inside the orchestrator's 15-minute timeout (research O10).
#
# Changed only through code review. No agent writes this file.
#
# `slots` must match config/schedule.yaml (opportunistic_identifier.window_start,
# window_end, interval_minutes and portfolio_manager.before_close_minutes); a test
# keeps them equal.
#
# finnhub_calls_per_minute is 20 because the Finnhub account is shared with the
# other components (research O11).
#
# To run on Claude instead of Qwen: set model.provider: anthropic and
# model.name: claude-sonnet-5-5, and set OPPORTUNISTIC_IDENTIFIER_ANTHROPIC_API_KEY.

# Tickers to scan, chosen by the owner (focus: tech, AI, semiconductors, energy). US common
# stock only: foreign ADRs fail the universe rule in config/risk.yaml. Names below the floors
# are skipped at screening. Sorted and de-duplicated at load.
scan_universe:
  # Semiconductors
  - NVDA
  - AVGO
  - AMD
  - MU
  - INTC
  - QCOM
  - TXN
  - ADI
  - AMAT
  - LRCX
  - KLAC
  - MRVL
  - MCHP
  - NXPI
  - "ON"            # quoted: bare ON is a YAML boolean
  - MPWR
  - TER
  - ENTG
  - SWKS
  - COHR
  # Tech, software, AI
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - META
  - ORCL
  - CRM
  - NOW
  - ADBE
  - INTU
  - PLTR
  - SNOW
  - CRWD
  - PANW
  - DDOG
  - NET
  - MDB
  - IBM
  - CSCO
  - ANET
  # AI hardware and data centers
  - DELL
  - SMCI
  - HPE
  - VRT
  - ETN
  # Power for AI
  - CEG
  - VST
  - GEV
  - NRG
  - TLN
  # Energy
  - XOM
  - CVX
  - COP
  - EOG
  - OXY
  - DVN
  - FANG
  - EQT
  - CTRA
  - SLB
  - HAL
  - BKR
  - MPC
  - VLO
  - PSX
  - WMB
  - KMI
  - OKE
  - TRGP
  - LNG

slice_size: 40                 # names fetched per run, 1-200
shortlist_size: 20             # names sent to the model, 1-40
quote_max_age_minutes: 15      # 1-60
finnhub_calls_per_minute: 20   # 1-60
rationale_max_chars: 800       # 200-10000; shortlist_size x (this / 3 + 60) must fit max_output_tokens
max_input_chars: 60000         # 5000-300000

slots:
  first: "10:00"
  last: "15:00"
  every_minutes: 60
  before_close_minutes: 30

model:
  provider: qwen               # qwen | anthropic
  name: qwen3.7-plus           # e.g. claude-sonnet-5-5 with provider: anthropic
  max_output_tokens: 8000
  timeout_seconds: 120         # 30-300
  anthropic_effort: medium
