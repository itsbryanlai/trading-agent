# When the orchestrator starts each LLM agent (python -m trading_agent.orchestrator).
#
# Schema: specs/005-orchestrator/contracts/orchestrator-interface.md
# ("Configuration"). Every key is required and unknown keys are rejected; a bad
# file means the orchestrator refuses to start. Times are ET wall-clock.
#
# Changed only through code review (spec FR-015). No agent writes this file.
# The loader enforces ADR 0011's bounds: PM runs at least 30 minutes apart, no PM
# start after 15:30 ET or within 30 minutes of the close, and a report wait of at
# least 5 minutes.
#
# Each agent's feature enables its own entry and lists its variables, which must
# start with its prefix (ADR 0015). Research is enabled (feature 007) and so is the
# PM (feature 008); the Opportunistic Identifier doesn't exist yet and stays disabled.

research:
  enabled: true                # specs/007-research-agent
  module: trading_agent.research
  env:                         # RESEARCH_* names only; unset ones aren't passed
    - RESEARCH_DATABASE_URL
    - RESEARCH_FINNHUB_API_KEY
    - RESEARCH_DASHSCOPE_API_KEY     # model.provider: qwen (config/research.yaml)
    - RESEARCH_QWEN_BASE_URL         # model.provider: qwen
    - RESEARCH_ANTHROPIC_API_KEY     # model.provider: anthropic
  timeout_minutes: 15
  daily_at: "08:30"            # before the 09:30 open
  interval_minutes: null       # optional intraday runs; null = off

opportunistic_identifier:
  enabled: false
  module: trading_agent.opportunistic_identifier
  env: []                      # OPPORTUNISTIC_IDENTIFIER_* names only
  # 15, not 10: the run's fetch deadline and model attempts are budgeted against it
  # (specs/011-opportunistic-identifier research O10). Must stay under interval_minutes.
  timeout_minutes: 15
  window_start: "10:00"
  window_end: "15:00"
  interval_minutes: 60

portfolio_manager:
  enabled: true                # specs/008-portfolio-manager
  module: trading_agent.portfolio_manager
  env:                         # PORTFOLIO_MANAGER_* names only; unset ones aren't passed
    - PORTFOLIO_MANAGER_DATABASE_URL
    - PORTFOLIO_MANAGER_FINNHUB_API_KEY
    - PORTFOLIO_MANAGER_DASHSCOPE_API_KEY     # model.provider: qwen (config/portfolio_manager.yaml)
    - PORTFOLIO_MANAGER_QWEN_BASE_URL         # model.provider: qwen
    - PORTFOLIO_MANAGER_ANTHROPIC_API_KEY     # model.provider: anthropic
  timeout_minutes: 10
  morning_session: "10:00"     # at or after the open, before the cutoff
  min_spacing_minutes: 30      # >= 30 (ADR 0011)
  report_wait_minutes: 5       # 5-60
  last_start: "15:30"          # <= 15:30 (ADR 0011)
  before_close_minutes: 30     # >= 30; the cutoff is the earlier of this and last_start
  # ADR 0021: observe-only. true = a known trading pause doesn't stop PM runs (an
  # unreadable flag still does). Set false at switch-on, before unpausing.
  run_while_paused: true
