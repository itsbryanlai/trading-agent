# Settings for the Portfolio Manager (python -m trading_agent.portfolio_manager).
#
# Schema: specs/008-portfolio-manager/contracts/pm-interface.md
# ("Configuration"). Every key is required and unknown keys are rejected; a bad
# file means the PM refuses to start (exit 2).
#
# Changed only through code review. No agent writes this file. The PM never reads
# config/risk.yaml.
#
# To run the PM on Claude instead of Qwen: set model.provider: anthropic and
# model.name: claude-sonnet-5-5, and set PORTFOLIO_MANAGER_ANTHROPIC_API_KEY.

quote_max_age_minutes: 5          # a quote older than this when fetched is stale
finnhub_calls_per_minute: 30
quote_phase_seconds: 90           # stop fetching quotes after this long
journal_entries: 5                # recent journal days shown to the model
journal_summary_max_chars: 2000
rationale_max_chars: 2000         # each report's rationale, cut before the model sees it
reasoning_max_chars: 2000         # the PM's own reasoning, cut before it is written
source_title_max_chars: 300       # each source's title, cut before the model sees it
sources_per_report: 10            # sources listed per report (evidence counts cover all)
max_input_chars: 300000
model:
  provider: qwen                  # qwen | anthropic
  name: qwen3.7-plus              # e.g. claude-sonnet-5-5 with provider: anthropic
  max_output_tokens: 8000
  timeout_seconds: 150
  anthropic_effort: medium        # low | medium | high
